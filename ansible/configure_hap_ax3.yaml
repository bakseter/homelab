---
- name: Configure MikroTik hAP ax3 as AP
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - group_vars/all/hap_ax3.yaml
  module_defaults:
    group/community.routeros.api:
      hostname: '{{ hap_ax3_host }}'
      username: '{{ hap_ax3_username }}'
      password: '{{ hap_ax3_password }}'
      tls: false
  tasks:
    - name: Set identity
      community.routeros.api: { path: system identity, cmd: 'set name=hap-ax3' }

    - name: Set wifi1 5GHz as AP
      community.routeros.api_find_and_modify:
        path: interface wifi
        find: { default-name: wifi1 }
        values:
          configuration.mode: ap
          configuration.ssid: '{{ wifi_ssid }}'
          configuration.country: Norway
          security.authentication-types: wpa2-psk,wpa3-psk
          security.passphrase: '{{ wifi_password }}'
          security.ft: 'no'
          security.ft-over-ds: 'no'
          disabled: 'no'

    - name: Set wifi2 2.4GHz as AP
      community.routeros.api_find_and_modify:
        path: interface wifi
        find: { default-name: wifi2 }
        values:
          configuration.mode: ap
          configuration.ssid: '{{ wifi_ssid }}'
          configuration.country: Norway
          security.authentication-types: wpa2-psk,wpa3-psk
          security.passphrase: '{{ wifi_password }}'
          security.ft: 'no'
          security.ft-over-ds: 'no'
          disabled: 'no'

    - name: Gather DHCP servers
      community.routeros.api: { path: ip dhcp-server, cmd: 'print' }
      register: _srv_raw

    - name: Remove all DHCP servers
      community.routeros.api:
        path: ip dhcp-server
        remove: "{{ item['.id'] }}"
      loop: '{{ _srv_raw.msg if (_srv_raw.msg is iterable and _srv_raw.msg is not string) else [] }}'
      ignore_errors: true

    #   - name: Gather NAT rules
    #     community.routeros.api: { path: ip firewall nat, cmd: 'print' }
    #     register: _nat_raw

    #   - name: Remove all NAT rules
    #     community.routeros.api:
    #       path: ip firewall nat
    #       remove: "{{ item['.id'] }}"
    #     loop: '{{ _nat_raw.msg if (_nat_raw.msg is iterable and _nat_raw.msg is not string) else [] }}'
    #     ignore_errors: true

    - name: Disable insecure IP services
      community.routeros.api_find_and_modify:
        path: ip service
        find: { name: '{{ item }}' }
        values: { disabled: 'yes' }
      loop: [telnet, ftp]
      ignore_errors: true

