---
- name: Configure MikroTik hAP ax3 as AP
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - group_vars/all/hap_ax3.yaml

  module_defaults:
    group/community.routeros.api:
      hostname: '{{ hap_ax3_host }}'
      username: '{{ hap_ax3_username }}'
      password: '{{ hap_ax3_password }}'
      tls: false

  tasks:
    # -------------------------
    # Identity
    # -------------------------
    - name: Set identity
      community.routeros.api:
        path: system identity
        cmd: 'set name=hap-ax3'

    # -------------------------
    # Bridge ports
    # ether1 = uplink to rb5009 ether6.
    # Kept pvid 50 + admit-all so untagged VLAN 50 (mgmt/wifi) keeps working
    # and tagged VLANs (90 later) can be trunked on the same port.
    # ether2-5 = access VLAN 50 (one of them goes to the hAP ax S).
    # -------------------------
    - name: Set ether1 as uplink (pvid 50, admit-all)
      community.routeros.api_find_and_modify:
        path: interface bridge port
        find:
          interface: ether1
        values:
          pvid: '50'
          frame-types: admit-all
          ingress-filtering: 'yes'

    - name: Set ether2-5 as access ports VLAN 50
      community.routeros.api_find_and_modify:
        path: interface bridge port
        find:
          interface: '{{ item }}'
        values:
          pvid: '50'
          frame-types: admit-only-untagged-and-priority-tagged
          ingress-filtering: 'yes'
      loop: [ether2, ether3, ether4, ether5]

    - name: Add wifi1 to bridge (pvid 50)
      community.routeros.api:
        path: interface bridge port
        cmd: 'add interface=wifi1 bridge=bridge pvid=50 frame-types=admit-only-untagged-and-priority-tagged ingress-filtering=yes'
      ignore_errors: true

    - name: Add wifi2 to bridge (pvid 50)
      community.routeros.api:
        path: interface bridge port
        cmd: 'add interface=wifi2 bridge=bridge pvid=50 frame-types=admit-only-untagged-and-priority-tagged ingress-filtering=yes'
      ignore_errors: true

    # -------------------------
    # Bridge VLAN table - VLAN 50 only for now (VLAN 90 added later)
    # -------------------------
    - name: Ensure bridge VLAN 50
      community.routeros.api:
        path: interface bridge vlan
        cmd: 'add bridge=bridge vlan-ids=50 tagged=bridge untagged=ether1,ether2,ether3,ether4,ether5,wifi1,wifi2'
      ignore_errors: true

    # -------------------------
    # WiFi - 2.4GHz + 5GHz APs, main SSID on VLAN 50 (untagged via bridge pvid)
    # -------------------------
    - name: Set wifi1 2.4GHz as AP
      community.routeros.api_find_and_modify:
        path: interface wifi
        find:
          default-name: wifi1
        values:
          configuration.mode: ap
          configuration.ssid: '{{ wifi_ssid }}'
          configuration.country: Norway
          security.authentication-types: wpa2-psk,wpa3-psk
          security.passphrase: '{{ wifi_password }}'
          security.ft: 'no'
          security.ft-over-ds: 'no'
          disabled: 'no'

    - name: Set wifi2 5GHz as AP
      community.routeros.api_find_and_modify:
        path: interface wifi
        find:
          default-name: wifi2
        values:
          configuration.mode: ap
          configuration.ssid: '{{ wifi_ssid }}'
          configuration.country: Norway
          security.authentication-types: wpa2-psk,wpa3-psk
          security.passphrase: '{{ wifi_password }}'
          security.ft: 'no'
          security.ft-over-ds: 'no'
          disabled: 'no'

    - name: Remove existing wifi3 if any
      community.routeros.api:
        path: interface wifi
        cmd: 'remove [find name=wifi3]'
      ignore_errors: true

    # -------------------------
    # Interface list
    # -------------------------
    - name: Add bridge to LAN list
      community.routeros.api:
        path: interface list member
        cmd: 'add interface=bridge list=LAN comment=ap'
      ignore_errors: true

    # -------------------------
    # DHCP client on bridge (untagged VLAN 50, served by rb5009)
    # -------------------------
    - name: Remove existing DHCP clients
      community.routeros.api:
        path: ip dhcp-client
        cmd: 'remove [find]'
      ignore_errors: true

    - name: Add DHCP client on bridge
      community.routeros.api:
        path: ip dhcp-client
        cmd: 'add interface=bridge disabled=no'
      ignore_errors: true

    # -------------------------
    # AP hardening: no DHCP server, no NAT, no default 88.1, no insecure services
    # -------------------------
    - name: Gather DHCP servers
      community.routeros.api:
        path: ip dhcp-server
        cmd: 'print'
      register: dhcp_servers

    - name: Remove all DHCP servers
      community.routeros.api:
        path: ip dhcp-server
        remove: "{{ item['.id'] }}"
      loop: '{{ dhcp_servers.msg | list }}'
      ignore_errors: true

    - name: Remove all NAT rules
      community.routeros.api:
        path: ip firewall nat
        cmd: 'remove [find]'
      ignore_errors: true

    - name: Disable default IP address
      community.routeros.api_find_and_modify:
        path: ip address
        find:
          address: 192.168.88.1/24
        values:
          disabled: 'yes'
      ignore_errors: true

    - name: Disable insecure IP services (keep winbox + api)
      community.routeros.api:
        path: ip service
        cmd: 'disable {{ item }}'
      loop: [telnet, ftp, www]
      ignore_errors: true

    # -------------------------
    # Enable VLAN filtering LAST
    # -------------------------
    - name: Enable bridge VLAN filtering
      community.routeros.api_find_and_modify:
        path: interface bridge
        find:
          name: bridge
        values:
          vlan-filtering: 'yes'
          ingress-filtering: 'yes'

  post_tasks:
    - name: Show bridge ports
      community.routeros.api: { path: interface bridge port, cmd: print }
      register: ports
    - ansible.builtin.debug: { var: ports }
    - name: Show bridge VLANs
      community.routeros.api: { path: interface bridge vlan, cmd: print }
      register: bvlans
    - ansible.builtin.debug: { var: bvlans }
    - name: Show wifi
      community.routeros.api: { path: interface wifi, cmd: print }
      register: wifi
    - ansible.builtin.debug: { var: wifi }
    - name: Show DHCP clients
      community.routeros.api: { path: ip dhcp-client, cmd: print }
      register: dhcp
    - ansible.builtin.debug: { var: dhcp }
