  namespace: harbor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: harbor-database

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: harbor
            app.kubernetes.io/component: core
        - matchLabels:
            app.kubernetes.io/name: harbor
            app.kubernetes.io/component: jobservice
      toPorts:
        - ports:
            - port: '5432'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: '5432'
              protocol: TCP
            - port: '8000'
              protocol: TCP

  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
