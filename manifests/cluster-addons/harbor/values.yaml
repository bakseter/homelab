harbor:
  core:
    image:
      repository: docker.io/goharbor/harbor-core
      tag: v2.15.2@sha256:d7b780d23721a000f0fb8e181add6675eafa336de5d033b77fd7da0c171ff7f7

  portal:
    image:
      repository: docker.io/goharbor/harbor-portal
      tag: v2.15.3@sha256:30278a07321521a409946bfcbdec63f8c43d69892a2155a5e8d1ab7f10d206a1

  jobservice:
    image:
      repository: docker.io/goharbor/harbor-jobservice
      tag: v2.15.2@sha256:f71a4452a095bcd2a8f0683648a3ae28415432df87ccfb00ec7625f3e340a598

  redis:
    internal:
      image:
        repository: docker.io/goharbor/valkey-photon
        tag: v2.15.3@sha256:3a9b396bb1aa7a517a09b6e29d72f4f3fcd82dbb4ed09474f28062b63a79bc71

  database:
    type: external
    external:
      host: harbor-database-rw.harbor.svc.cluster.local
      username: app
      coreDatabase: app
      existingSecret: harbor-database-app

  registry:
    registry:
      image:
        repository: docker.io/goharbor/registry-photon
        tag: v2.15.3@sha256:6633841aea3a268f8c43c4083291023e3ffe481eb23aee7ee5b4162de0d034f0

    controller:
      image:
        repository: docker.io/goharbor/harbor-registryctl
        tag: v2.15.3@sha256:59067e35534790a600ac625c8c9b96a52db27a08431c5ca822c46a1ea1ca8556

  updateStrategy:
    type: Recreate

  externalURL: https://harbor.int.bakseter.net

  expose:
    type: route
    tls:
      enabled: false
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-int
          namespace: tailscale

      hosts:
        - harbor.int.bakseter.net

  persistence:
    persistentVolumeClaim:
      registry:
        size: 50Gi
      trivy:
        size: 10Gi

  trivy:
    enabled: true
    image:
      repository: docker.io/goharbor/trivy-adapter-photon
      tag: v2.15.3@sha256:12352dc823281ccb3e9ee3af4039f7b6c4eb7a575a0cd5ceae7f1e18af88d53f

    ignoreUnfixed: true
    severity: 'MEDIUM,HIGH,CRITICAL'
