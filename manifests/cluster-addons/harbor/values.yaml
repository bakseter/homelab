harbor:
  core:
    image:
      repository: docker.io/goharbor/harbor-core
      tag: v2.16.0@sha256:9174a38ef7de02a6b2aa228906465e0e46426ba6f3e6c900cd6090ceaec1c3e7

  portal:
    image:
      repository: docker.io/goharbor/harbor-portal
      tag: v2.16.0@sha256:60411e3b273d9b27aa8e95871c7f8f3e6b4de512e72e19f40fca910e60518c3c

  jobservice:
    image:
      repository: docker.io/goharbor/harbor-jobservice
      tag: v2.16.0@sha256:0f55399b8b8316f30976a5474c4cecb3641ee988496e68f3c218ecc7e1324ab4

  redis:
    internal:
      image:
        repository: docker.io/goharbor/valkey-photon
        tag: v2.16.0@sha256:44fa260f5bbe7b47dbf52c57120f1cdf155edfba5a036e1591934f65ddf89f55

  database:
    type: external
    external:
      host: harbor-database-rw.harbor.svc.cluster.local
      username: app
      coreDatabase: app
      existingSecret: harbor-database-app

  registry:
    registry:
      image:
        repository: docker.io/goharbor/registry-photon
        tag: v2.16.0@sha256:c9c4f8a9376c7ae24f32e9212e56064f524cd8f0a23755618f2df99767b0ac3e

    controller:
      image:
        repository: docker.io/goharbor/harbor-registryctl
        tag: v2.16.0@sha256:f2b22ddb6d65e91c676d9bf5e28ecd50ef22d5430d9941eb51a57f6e33c0d3bc

  updateStrategy:
    type: Recreate

  externalURL: https://harbor.int.bakseter.net

  expose:
    type: route
    tls:
      enabled: false
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-int
          namespace: tailscale

      hosts:
        - harbor.int.bakseter.net

  persistence:
    persistentVolumeClaim:
      registry:
        size: 50Gi
      trivy:
        size: 10Gi

  trivy:
    enabled: true
    image:
      repository: docker.io/goharbor/trivy-adapter-photon
      tag: v2.16.0@sha256:36ab1b63ba2ac230e7f9f5d2725fe999a27b1fc270b7b5ae1419fd8f46b0b969

    ignoreUnfixed: true
    severity: 'MEDIUM,HIGH,CRITICAL'
