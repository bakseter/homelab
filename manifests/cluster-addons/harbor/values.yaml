harbor:
  core:
    image:
      repository: docker.io/goharbor/harbor-core
      tag: v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112

  portal:
    image:
      repository: docker.io/goharbor/harbor-portal
      tag: v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75

  jobservice:
    image:
      repository: docker.io/goharbor/harbor-jobservice
      tag: v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82

  redis:
    internal:
      image:
        repository: docker.io/goharbor/valkey-photon
        tag: v2.15.4@sha256:bb022e8f236f56f53cee7bb1f609595e497da67d829048e0af2284f97e6eb54f

  database:
    type: external
    external:
      host: harbor-database-rw.harbor.svc.cluster.local
      username: app
      coreDatabase: app
      existingSecret: harbor-database-app

  registry:
    registry:
      image:
        repository: docker.io/goharbor/registry-photon
        tag: v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3

    controller:
      image:
        repository: docker.io/goharbor/harbor-registryctl
        tag: v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7

  updateStrategy:
    type: Recreate

  externalURL: https://harbor.int.bakseter.net

  expose:
    type: route
    tls:
      enabled: false
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-int
          namespace: tailscale

      hosts:
        - harbor.int.bakseter.net

  persistence:
    persistentVolumeClaim:
      registry:
        size: 50Gi
      trivy:
        size: 10Gi

  trivy:
    enabled: true
    image:
      repository: docker.io/goharbor/trivy-adapter-photon
      tag: v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9

    ignoreUnfixed: true
    severity: 'MEDIUM,HIGH,CRITICAL'
