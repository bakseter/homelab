apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podcertificate-controller
  namespace: podcertificate-controller-system
spec:
  endpointSelector:
    matchLabels:
      app: podcertificate-controller

  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
# Extension of existing vanilla netpol
# TODO: move everything here
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: ate-api-server

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
        - matchLabels:
            app: ate-controller
        - matchLabels:
            app: atenet-egress
        - matchLabels:
            app: atenet-router
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/instance: kagent-database
      toPorts:
        - ports:
            - port: '5432'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rustfs
            app.kubernetes.io/name: rustfs
      toPorts:
        - ports:
            - port: '9000'
              protocol: TCP

    # TODO: harden
    - toEntities:
        - world

    - toEndpoints:
        - matchLabels:
            app: atelet
      toPorts:
        - ports:
            - port: '21998'
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
