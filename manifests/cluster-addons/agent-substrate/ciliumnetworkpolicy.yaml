kind: CiliumNetworkPolicy
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: atenet-egress

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            ate.dev/worker-pool: kagent-default
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app: k8s-credential-provider
      toPorts:
        - ports:
            - port: '50051'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: '8083'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: agentgateway-proxy
            gateway.networking.k8s.io/gateway-name: agentgateway-proxy
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: mcp-gateway
            gateway.networking.k8s.io/gateway-name: mcp-gateway
      toPorts:
        - ports:
            - port: '8101'
              protocol: TCP
