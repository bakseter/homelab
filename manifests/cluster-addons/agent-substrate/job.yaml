apiVersion: batch/v1
kind: Job
metadata:
  name: ate-create-s3-buckets
  namespace: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/instance: ate
    app.kubernetes.io/name: create-s3-buckets
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ate
        app.kubernetes.io/name: create-s3-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-s3-buckets
          image: amazon/aws-cli:2.39.6@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kagent-rustfs-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-rustfs-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: 'us-east-1'
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ENDPOINT="http://rustfs-svc.rustfs.svc.cluster.local:9000"
              BUCKETS="ate-snapshots"

              echo "Testing connectivity..."
              aws --endpoint-url "$ENDPOINT" s3 ls || echo "FATAL: cannot reach endpoint"

              for BUCKET in $BUCKETS; do
                echo "Creating bucket: $BUCKET"
                if aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET" 2>&1; then
                  echo "✓ $BUCKET created"
                else
                  echo "checking if $BUCKET already exists..."
                  aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" 2>&1 && \
                    echo "✓ $BUCKET already exists, OK" || \
                    echo "✗ $BUCKET failed and does not exist — real error"
                fi
              done
