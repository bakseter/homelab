apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: substrate
    repo: oci://ghcr.io/kagent-dev/substrate/helm
    version: 1.0.1
    releaseName: substrate
    namespace: ate-system
    valuesFile: values-substrate.yaml

  - name: substrate-crds
    repo: oci://ghcr.io/kagent-dev/substrate/helm
    version: 1.0.1
    releaseName: substrate-crds

  - name: substrate-atelet
    repo: oci://ghcr.io/kagent-dev/substrate/helm
    version: 1.0.1
    releaseName: substrate-atelet
    namespace: ate-system
    valuesFile: values-substrate-atelet.yaml

  - name: substrate-podcert
    repo: oci://ghcr.io/kagent-dev/substrate/helm
    version: 1.0.1
    releaseName: substrate-podcert
    namespace: podcertificate-controller-system

resources:
  - ciliumnetworkpolicy.yaml
  - configmap.yaml
  - job.yaml
  - namespace.yaml
  - sealedsecret.yaml

patches:
  - target:
      kind: Deployment
      name: ate-api-server
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault

  - target:
      kind: Deployment
      name: ate-controller
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault

  - target:
      kind: Deployment
      name: ate-idp-server
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault

  - target:
      kind: Deployment
      name: atenet-egress
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true

      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

  - target:
      kind: Deployment
      name: atenet-router
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true

      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

  - target:
      kind: Deployment
      name: k8s-credential-provider
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true

  - target:
      kind: Deployment
      name: podcertificate-controller
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault

  - target:
      kind: DaemonSet
      name: atelet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.bakseter.net/agent: 'true'

      - op: add
        path: /spec/template/spec/tolerations/2
        value:
          key: node-role.bakseter.net/agent
          operator: Equal
          value: 'true'
          effect: NoSchedule
