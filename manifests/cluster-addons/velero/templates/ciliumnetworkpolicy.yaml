apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero
  namespace: velero
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: velero
      name: velero

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP

    - toFQDNs:
        - matchName: 'hel1.your-objectstorage.com'
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
---
