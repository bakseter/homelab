apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: nightly
  namespace: velero
spec:
  schedule: '0 3 * * *'
  template:
    ttl: 168h
    storageLocation: default
    snapshotMoveData: true
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
      - secrets
    labelSelector:
      matchLabels:
        bakseter.net/backup: 'true'
