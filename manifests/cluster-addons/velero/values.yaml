velero:
  snapshotsEnabled: true
  deployNodeAgent: true

  image:
    repository: docker.io/velero/velero
    tag: v1.19.0@sha256:da94e0de154f837db0ada37ea0c168428943dab2c872efc10481189925de395f

  extraVolumes:
    - emptyDir: {}
      name: udmrepo
  extraVolumeMounts:
    - mountPath: /nonexistent
      name: udmrepo

  configuration:
    features: EnableCSI
    uploaderType: kopia

    volumeSnapshotLocation:
      - name: default
        provider: csi

    backupStorageLocation:
      - name: default
        provider: aws
        bucket: bakseter-homelab-velero
        config:
          region: eu-central
          s3ForcePathStyle: true
          s3Url: https://hel1.your-objectstorage.com

  credentials:
    existingSecret: velero-s3-credentials

  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - mountPath: /target
          name: plugins

  nodeAgent:
    podSecurityContext: {}

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    extraVolumes:
      - emptyDir: {}
        name: udmrepo
    extraVolumeMounts:
      - mountPath: /nonexistent
        name: udmrepo

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    supplementalGroups:
      - 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
