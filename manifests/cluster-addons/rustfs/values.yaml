rustfs:
  image:
    rustfs:
      repository: rustfs/rustfs
      tag: 1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    initImage:
      repository: busybox
      tag: stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

  mode:
    standalone:
      enabled: true

    distributed:
      enabled: false

  replicaCount: 2

  config:
    rustfs:
      log_level: warn

  secret:
    existingSecret: rustfs-credentials
    existingSecretAccessKeyKey: access_key
    existingSecretSecretKeyKey: secret_key

  storageclass:
    name: longhorn
    dataStorageSize: 50Gi
    logStorageSize: 5Gi

  ingress:
    enabled: false

  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
