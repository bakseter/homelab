gateway:
  nameOverride: gateway
  fullnameOverride: opentelemetry-collector-gateway
  mode: deployment
  replicaCount: 2

  image:
    repository: otel/opentelemetry-collector-k8s

  presets:
    kubernetesAttributes:
      enabled: true
    kubernetesEvents:
      enabled: true

  ports:
    jaeger-compat:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gateway
          topologyKey: bakseter.net/physical-node

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
      resource:
        attributes:
          - key: k8s.cluster.name
            value: homelab
            action: upsert
      batch: {}

    exporters:
      otlphttp/loki:
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/loki]

agent:
  nameOverride: agent
  mode: daemonset

  image:
    repository: otel/opentelemetry-collector-k8s

  presets:
    logsCollection:
      enabled: true
      includeCollectorLogs: false
    kubernetesAttributes:
      enabled: true

  tolerations:
    - effect: NoSchedule
      key: node-role.bakseter.net/agent
      operator: Equal
      value: 'true'

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  config:
    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.container.name
            - k8s.node.name
          labels:
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: logs.bakseter.net/scrape
              key: logs.bakseter.net/scrape
              from: pod
      resource:
        attributes:
          - key: k8s.cluster.name
            value: homelab
            action: upsert
      filter/drop_disabled:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["logs.bakseter.net/scrape"] == "false"'
      batch: {}

    exporters:
      otlphttp/loki:
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, filter/drop_disabled, resource, batch]
          exporters: [otlphttp/loki]
