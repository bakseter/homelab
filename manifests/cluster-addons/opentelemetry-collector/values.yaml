agent:
  nameOverride: agent
  mode: daemonset

  image:
    repository: otel/opentelemetry-collector-k8s

  presets:
    logsCollection:
      enabled: true
      includeCollectorLogs: false

  tolerations:
    - effect: NoSchedule
      key: node-role.bakseter.net/agent
      operator: Equal
      value: 'true'

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  config:
    processors:
      k8sattributes:
        extract:
          labels:
            - tag_name: logs.bakseter.net/scrape
              key: logs.bakseter.net/scrape
              from: pod
      filter/drop_disabled:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["logs.bakseter.net/scrape"] == "false"'
      batch: {}

    exporters:
      otlphttp/gateway:
        endpoint: http://opentelemetry-collector-gateway.otel.svc.cluster.local:4318

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            [memory_limiter, k8sattributes, filter/drop_disabled, batch]
          exporters: [otlphttp/gateway]

gateway:
  nameOverride: gateway
  fullnameOverride: opentelemetry-collector-gateway
  mode: deployment
  replicaCount: 3

  image:
    repository: otel/opentelemetry-collector-k8s

  presets:
    kubernetesAttributes:
      enabled: true

  ports:
    jaeger-compat:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gateway
          topologyKey: bakseter.net/physical-node

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
          labels:
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: logs.bakseter.net/scrape
              key: logs.bakseter.net/scrape
              from: pod
      transform/service_name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and (attributes["service.name"] == nil or attributes["service.name"] == "unknown_service")
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and (attributes["service.name"] == nil or attributes["service.name"] == "unknown_service")
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and (attributes["service.name"] == nil or attributes["service.name"] == "unknown_service")
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["k8s.pod.name"] != nil and (attributes["service.name"] == nil or attributes["service.name"] == "unknown_service")
      resource:
        attributes:
          - key: k8s.cluster.name
            value: homelab
            action: upsert
      batch: {}

    exporters:
      otlphttp/loki:
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors:
            [
              memory_limiter,
              k8sattributes,
              transform/service_name,
              resource,
              batch,
            ]
          exporters: [otlphttp/loki]
