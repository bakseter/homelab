apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
    spec:
      nodeSelector:
        node-role.bakseter.net/build: 'true'
      tolerations:
        - key: node-role.bakseter.net/build
          operator: Exists
          effect: NoSchedule
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          args:
            - --addr=tcp://0.0.0.0:1234
          ports:
            - containerPort: 1234
              name: grpc
          readinessProbe:
            exec:
              command:
                - buildctl
                - --addr
                - tcp://127.0.0.1:1234
                - debug
                - workers
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: cache
              mountPath: /var/lib/buildkit
            - name: config
              mountPath: /etc/buildkit
      hostUsers: false
      securityContext:
        seccompProfile:
          type: Unconfined
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: config
          configMap:
            name: buildkitd-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner
    spec:
      containers:
        - name: runner
          image: ghcr.io/bakseter/homelab/data.forgejo.org/forgejo/runner:13@sha256:aace339c9277e8a325cc3ea773c3abb8f096306ea0d63db0a01dcd4d0b0c24fe
          command:
            - forgejo-runner
            - daemon
            - --config
            - /config/config.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /config/config.yml
              subPath: config.yml
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: runner-state
        - name: workspace
          emptyDir: {}
        - name: config
          configMap:
            name: runner-config
