apiVersion: batch/v1
kind: Job
metadata:
  name: runner-register
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: data.forgejo.org/forgejo/runner:13@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
          command:
            - forgejo-runner
            - register
            - --no-interactive
            - --instance
            - http://forgejo-http.forgejo.svc.cluster.local:3000
            - --token
            - $(TOKEN)
            - --name
            - k8s-runner
            - --labels
            - host:host
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /state
              name: state
          workingDir: /state
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: runner-state
