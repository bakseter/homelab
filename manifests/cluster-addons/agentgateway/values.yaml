agentgateway:
  rbac:
    gatewayNamespaces:
      - agentgateway-system

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  gatewayClassParametersRefs:
    agentgateway:
      name: agentgateway-config
      namespace: agentgateway-system

  istio:
    enabled: false

  monitoring:
    enabled: true

    serviceMonitor:
      enabled: true

      extraLabels:
        release: kube-prometheus-stack
