agentgateway:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  gatewayClassParametersRefs:
    agentgateway:
      name: agentgateway-config
      namespace: agentgateway-system
