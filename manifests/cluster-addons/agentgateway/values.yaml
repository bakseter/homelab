agentgateway:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  gatewayClassParametersRefs:
    group: agentgateway.dev
    kind: AgentgatewayParameters
    name: agentgateway-config
