apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oda-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: agentgateway-system
      sectionName: oda
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: oda-mcp
---
