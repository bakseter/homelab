apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
          - group: agentgateway.dev
            kind: AgentgatewayModel
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: oda
      protocol: HTTP
      port: 8101
      allowedRoutes:
        namespaces:
          from: Same
    - name: github
      protocol: HTTP
      port: 8102
      allowedRoutes:
        namespaces:
          from: Same
    - name: grafana
      protocol: HTTP
      port: 8103
      allowedRoutes:
        namespaces:
          from: Same
