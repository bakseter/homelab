apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: oda-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: oda
        static:
          host: oda-mcp.kagent.svc.cluster.local
          port: 3000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oda-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oda/mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: oda-mcp
