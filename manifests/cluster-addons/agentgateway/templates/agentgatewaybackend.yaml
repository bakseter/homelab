apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: oda-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: oda
        static:
          host: oda-mcp.kagent.svc.cluster.local
          port: 3000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: github-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: github
        static:
          host: api.githubcopilot.com
          port: 443
          path: /mcp/readonly
  policies:
    auth:
      secretRef:
        name: github-mcp-pat
    tls:
      sni: api.githubcopilot.com
