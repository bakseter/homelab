apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-config
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: ClusterIP
      ports:
        - name: ui
          port: 15000
          protocol: TCP
          targetPort: 15000
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agentgateway
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
  modelCatalog:
    sources:
      - configMap:
          name: model-costs
          key: catalog.json
  rawConfig:
    config:
      database:
        url: 'sqlite:////data/data.db?mode=rwc'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-costs
  namespace: agentgateway-system
data:
  catalog.json: |
    {
      "providers": {
        "mistral": {
          "models": {
            "mistral-large-4": {
              "rates": {
                "input": "1.36",
                "output": "4.18",
                "cacheRead": "0.14"
              }
            },
            "zai-glm-5-3": {
              "rates": {
                "input": "1.4",
                "output": "4.4",
                "cacheRead": "0.14"
              }
            },
            "zai-glm-5-3-flash": {
              "rates": {
                "input": "0.15",
                "output": "0.5",
                "cacheRead": "0.03"
              }
            }
          }
        }
      }
    }
