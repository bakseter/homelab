apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
      agentgateway: agentgateway

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway-proxy
            gateway.networking.k8s.io/gateway-name: agentgateway-proxy
        - matchLabels:
            app.kubernetes.io/name: mcp-gateway
            gateway.networking.k8s.io/gateway-name: mcp-gateway
      toPorts:
        - ports:
            - port: '9978'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '9092'
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-proxy
      gateway.networking.k8s.io/gateway-name: agentgateway-proxy

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: tailscale-int
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP
        - ports:
            - port: '15000'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: open-webui
            app.kubernetes.io/name: open-webui
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '15020'
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway
            agentgateway: agentgateway
      toPorts:
        - ports:
            - port: '9978'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: '4317'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mistral-reasoning-normalizer
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-gateway
  namespace: agentgateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      gateway.networking.k8s.io/gateway-name: mcp-gateway

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: '8101' # oda-mcp
              protocol: TCP
            - port: '8102' # github-mcp
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '15020'
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway
            agentgateway: agentgateway
      toPorts:
        - ports:
            - port: '9978'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: '4317'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: oda-mcp
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP

    - toFQDNs:
        - matchName: 'api.githubcopilot.com'
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
