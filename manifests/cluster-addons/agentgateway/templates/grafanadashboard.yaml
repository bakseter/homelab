apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  title: agentgateway
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agentgateway-dashboard
  namespace: agentgateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: agentgateway-dashboard
    key: agentgateway.json
