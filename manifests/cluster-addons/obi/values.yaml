opentelemetry-ebpf-instrumentation:
  env:
    OTEL_EBPF_KUBE_METADATA_ENABLE: 'true'
    OTEL_EBPF_KUBE_CLUSTER_NAME: homelab

  config:
    data:
      otel_traces_export:
        endpoint: http://opentelemetry-collector-gateway.otel.svc.cluster.local:4318
        protocol: http/protobuf

      otel_metrics_export: null

      discovery:
        instrument:
          - k8s_namespace: 'authentik'
          - k8s_namespace: 'cloudflared'
          - k8s_namespace: 'forgejo'
          - k8s_namespace: 'immich'
          - k8s_namespace: 'media'
