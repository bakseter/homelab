open-webui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: 0.12.4-slim@sha256:41812075aede8ada8497cb2b71c76412978633eee72775bb77796f593d03b677

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  volumes:
    - name: tmp
      emptyDir:
        maxSize: 128Mi

  volumeMounts:
    container:
      - name: tmp
        mountPath: /tmp

  route:
    enabled: true
    hostnames:
      - ai.bakseter.net

  persistence:
    enabled: true
    size: 1Gi
    labels:
      recurring-job-group.longhorn.io/hetzner-backup: enabled
      recurring-job.longhorn.io/source: enabled

  openaiBaseApiUrl: 'http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1'
  openaiApiKeyExistingSecret: agentgateway-virtual-key
  openaiApiKeyExistingSecretKey: VIRTUAL_KEY

  extraEnvVars:
    - name: HOME
      value: /tmp

  ollama:
    enabled: false
  pipelines:
    enabled: false
  websocket:
    enabled: false
