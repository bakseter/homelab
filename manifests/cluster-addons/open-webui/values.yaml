open-webui:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  route:
    enabled: true
    hostnames:
      - ai.bakseter.net

  persistence:
    enabled: true
    size: 1Gi
    labels:
      recurring-job-group.longhorn.io/hetzner-backup: enabled
      recurring-job.longhorn.io/source: enabled

  ollama:
    enabled: false
  pipelines:
    enabled: false
  websocket:
    enabled: false
