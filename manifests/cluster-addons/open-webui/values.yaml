open-webui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: v0.13.0-slim@sha256:283efb20756785229a388bcd1e56a052f5284ae8c861717eed5eaaa3bba6b20a

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 128Mi

  volumeMounts:
    container:
      - name: tmp
        mountPath: /tmp

  route:
    enabled: true
    hostnames:
      - ai.bakseter.net
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: tailscale-home
        namespace: tailscale

  persistence:
    enabled: true
    size: 1Gi
    labels:
      recurring-job-group.longhorn.io/hetzner-backup: enabled
      recurring-job.longhorn.io/source: enabled

  openaiBaseApiUrl: 'http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1'
  openaiApiKeyExistingSecret: agentgateway-virtual-key
  openaiApiKeyExistingSecretKey: VIRTUAL_KEY

  extraEnvVars:
    - name: HOME
      value: /tmp

    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: WEBUI_SECRET_KEY

  copyAppData:
    command:
      [
        'sh',
        '-c',
        'cp -R -n /app/backend/data/. /tmp/app-data/ 2>/dev/null; exit 0',
      ]

  ollama:
    enabled: false
  pipelines:
    enabled: false
  websocket:
    enabled: false
