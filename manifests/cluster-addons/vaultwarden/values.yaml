podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  supplementalGroups:
    - 1000
  seccompProfile:
    type: RuntimeDefault

replicas: 1

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

domain: https://vaultwarden.bakseter.no

strategy:
  type: Recreate

image:
  registry: docker.io
  repository: vaultwarden/server
  tag: 1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb

storage:
  data:
    name: vaultwarden-data
    size: 1Gi
    class: longhorn-encrypted
    path: /data
    accessMode: ReadWriteOnce

  attachments:
    name: vaultwarden-files
    size: 1Gi
    class: longhorn-encrypted
    path: /files
    accessMode: ReadWriteOnce

database:
  type: postgresql
  existingSecret: vaultwarden-database-app
  existingSecretKey: uri

sso:
  enabled: false
