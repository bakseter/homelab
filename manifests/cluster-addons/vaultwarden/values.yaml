podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  supplementalGroups:
    - 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

domain: https://vaultwarden.bakseter.no

strategy:
  type: Recreate

image:
  registry: docker.io
  repository: vaultwarden/server
  tag: 1.37.0-alpine@sha256:88b74551f5d79fd43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767

storage:
  data:
    name: vaultwarden-data
    size: 1Gi
    class: longhorn-encrypted
    path: /data
    accessMode: ReadWriteOnce

  attachments:
    name: vaultwarden-files
    size: 1Gi
    class: longhorn-encrypted
    path: /files
    accessMode: ReadWriteOnce

database:
  type: postgresql
  existingSecret: vaultwarden-database-app
  existingSecretKey: uri

sso:
  enabled: false
