image:
  repository: docker.io/jellyfin/jellyfin
  tag: 12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037

resources:
  limits:
    gpu.intel.com/i915: '1'

persistence:
  config:
    enabled: true
    size: 5Gi
  media:
    enabled: true
    existingClaim: shared-media
  cache:
    enabled: true
    size: 10Gi

deploymentStrategy:
  type: Recreate

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
  supplementalGroups:
    - 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: log
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: log
    mountPath: /log

jellyfin:
  env:
    - name: JELLYFIN_CACHE_DIR
      value: /cache
    - name: JELLYFIN_LOG_DIR
      value: /log
