image:
  repository: docker.io/jellyfin/jellyfin
  tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771

resources:
  limits:
    gpu.intel.com/i915: '1'

persistence:
  config:
    enabled: true
    size: 5Gi
    labels:
      recurring-job-group.longhorn.io/hetzner-backup: enabled
      recurring-job.longhorn.io/source: enabled
  media:
    enabled: true
    existingClaim: shared-media
  cache:
    enabled: true
    size: 10Gi

deploymentStrategy:
  type: Recreate

httpRoute:
  enabled: true

  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tailscale-home
      namespace: tailscale

  hostnames:
    - jellyfin.bakseter.net

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
  supplementalGroups:
    - 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: log
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: log
    mountPath: /log

jellyfin:
  env:
    - name: JELLYFIN_CACHE_DIR
      value: /cache
    - name: JELLYFIN_LOG_DIR
      value: /log
