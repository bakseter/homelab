apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beets

resources:
  - ciliumnetworkpolicy.yaml
  - configmap.yaml
  - cronjob.yaml
  - persistentvolumeclaim.yaml
  - pod.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: beets-plugins
    files:
      - coverrg.py
