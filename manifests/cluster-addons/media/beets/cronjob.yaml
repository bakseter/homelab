apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets
  namespace: media
spec:
  schedule: '30 4 * * *'
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: beets
        spec:
          restartPolicy: OnFailure
          containers:
            - name: beets
              image: ghcr.io/bakseter/homelab/beets:2.14.1@sha256:77bdd2e49b5e2bf7b7dc03f3178c6b54ac4571d547ec78a984b91ce272a7309c
              command: ['/bin/sh', '-c']
              args:
                - |
                  set -e
                  beet import -A -q /media/music
                  beet mbsync "added:$(date -d '-3 days' +%Y-%m-%d).."
                  beet coverrg -f "added:$(date -d '-3 days' +%Y-%m-%d).."
              env:
                - name: HOME
                  value: /config
                - name: BEETSDIR
                  value: /config
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - mountPath: /config
                  name: config
                - mountPath: /config/config.yaml
                  name: beets-config
                  subPath: config.yaml
                  readOnly: true
                - mountPath: /config/plugins
                  name: beets-plugins
                  readOnly: true
                - mountPath: /media
                  name: media
                - mountPath: /tmp
                  name: tmp
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: beets-config
            - name: beets-config
              configMap:
                name: beets-config
            - name: beets-plugins
              configMap:
                name: beets-plugins
            - name: media
              persistentVolumeClaim:
                claimName: shared-media
            - emptyDir: {}
              name: tmp
