apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: audiobookshelf
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: audiobookshelf
  timeout:
    http:
      requestTimeout: 3600s
      streamIdleTimeout: 3600s
      maxStreamDuration: 3600s
