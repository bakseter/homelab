apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iperf3
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: iperf3
    name: admin@homelab
  project: default
  source:
    path: manifests/cluster-addons/iperf3
    repoURL: https://github.com/bakseter/homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/enforce: privileged # needs hostNetwork
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
