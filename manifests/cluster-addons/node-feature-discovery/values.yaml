node-feature-discovery:
  image:
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.19.0@sha256:2fa1c99ad09bdf2c8ad97706a4ad2fd548c84d5ecd70ba32a6152c667b96c4d2

  gc:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

  master:
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    tolerations: [] # remove the control-plane toleration

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

  worker:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
