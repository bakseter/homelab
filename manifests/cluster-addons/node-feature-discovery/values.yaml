node-feature-discovery:
  image:
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.20.0@sha256:3f600513a463712aaab33cf525e20be0b5718e57da50d0ac2e092b86bcfc4812

  gc:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

  master:
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    tolerations: [] # remove the control-plane toleration

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

  worker:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
