node-feature-discovery:
  image:
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379

  gc:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

  master:
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    tolerations: [] # remove the control-plane toleration

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

  worker:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    config:
      core:
        featureSources: ['all', '-system']
        labelSources: ['all', '-system']
