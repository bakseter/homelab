apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-gc
  namespace: node-feature-discovery
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
      role: gc

  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
