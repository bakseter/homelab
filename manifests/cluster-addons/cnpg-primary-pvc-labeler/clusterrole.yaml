apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-primary-pvc-labeler
rules:
  - apiGroups: ['postgresql.cnpg.io']
    resources: ['clusters']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['persistentvolumeclaims']
    verbs: ['get', 'list', 'patch']
