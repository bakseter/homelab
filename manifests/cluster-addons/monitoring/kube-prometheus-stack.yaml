apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd-diff-preview/render: 'never' # TODO: has way to many weird generated resources, fix this by adding ignore
spec:
  destination:
    namespace: monitoring
    name: admin@homelab
  project: default
  source:
    path: manifests/cluster-addons/monitoring/kube-prometheus-stack
    repoURL: https://github.com/bakseter/homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
