apiVersion: batch/v1
kind: Job
metadata:
  name: loki-create-s3-buckets
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # https://github.com/kubernetes-sigs/kustomize/issues/641#issuecomment-3461010309
    internal.config.kubernetes.io/needsHashSuffix: 'enabled'
  labels:
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: create-s3-buckets
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: loki
        app.kubernetes.io/name: create-s3-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-s3-buckets
          image: amazon/aws-cli:2.39.7@sha256:bba262340b0bc7cbf3a8a48612531263b56f4b280c4f036a07816af1b271bda0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: 'us-east-1'
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ENDPOINT="http://rustfs-svc.rustfs.svc.cluster.local:9000"
              BUCKETS="loki-chunks loki-ruler loki-admin"

              echo "Testing connectivity..."
              aws --endpoint-url "$ENDPOINT" s3 ls || echo "FATAL: cannot reach endpoint"

              for BUCKET in $BUCKETS; do
                echo "Creating bucket: $BUCKET"
                if aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET" 2>&1; then
                  echo "✓ $BUCKET created"
                else
                  echo "checking if $BUCKET already exists..."
                  aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" 2>&1 && \
                    echo "✓ $BUCKET already exists, OK" || \
                    echo "✗ $BUCKET failed and does not exist — real error"
                fi
              done
