grafana-mcp:
  image:
    registry: docker.io
    repository: grafana/mcp-grafana
    tag: 2.4.0@sha256:63d4501d3166c2b9242d8a2b5b7df8892c59c6c477be3a2a61bcf8a252671f31

  grafana:
    url: http://grafana-service.monitoring.svc.cluster.local:3000
    apiKeySecret:
      name: grafana-api-key
      key: api-key

  extraArgs:
    - --transport=streamable-http
    - --allowed-hosts=grafana-mcp.monitoring.svc.cluster.local

  env:
    GRAFANA_USAGE_STATS: 'disabled'
    GRAFANA_FORWARD_HEADERS: 'Authorization' # workaround for disabling auth
