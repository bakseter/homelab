kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      scrapeInterval: 60s

      retention: 60d
      retentionSize: 65GB # https://prometheus.io/docs/prometheus/latest/storage/#right-sizing-retention-size

      tsdb:
        outOfOrderTimeWindow: 10m

      image:
        registry: quay.io
        repository: prometheus/prometheus
        tag: v3.14.0-distroless
        sha: 50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a

      externalUrl: https://prometheus.int.bakseter.net

      # for Tempo
      enableRemoteWriteReceiver: true
      enableFeatures:
        - exemplar-storage
        - native-histograms

      serviceMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - argocd
              - authentik
              - cert-manager
              - cloudflared
              - cnpg-system
              - external-dns
              - kube-system # cilium hubble
              - longhorn-system
              - monitoring
              - mandagsmiddag
              - tailscale

      podMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - amex
              - authentik
              - immich
              - mandagsmiddag
              - media
              - vaultwarden

      probeNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - monitoring

      storageSpec:
        volumeClaimTemplate:
          metadata:
            labels:
              recurring-job.longhorn.io/source: enabled
              recurring-job-group.longhorn.io/fstrim: enabled
          spec:
            accessModes: ['ReadWriteOnce']
            resources:
              requests:
                storage: 75Gi

      additionalScrapeConfigs:
        - job_name: proxmox-nodes
          static_configs:
            - targets:
                - 192.168.10.20:9100
              labels:
                hostname: m715q
            - targets:
                - 192.168.10.21:9100
              labels:
                hostname: m715q2
            - targets:
                - 192.168.10.22:9100
              labels:
                hostname: m720q
            - targets:
                - 192.168.10.23:9100
              labels:
                hostname: m920q
            - targets:
                - 192.168.10.24:9100
              labels:
                hostname: m70qg3
          relabel_configs:
            - target_label: job
              replacement: node-exporter-proxmox
            - source_labels: [hostname]
              target_label: instance
            - regex: hostname
              action: labeldrop

  defaultRules:
    create: true
    rules:
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      windows: false

  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)

  kubelet:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: rest_client_request_duration_seconds_(bucket|sum|count)

  alertmanager:
    enabled: true

    alertmanagerSpec:
      image:
        registry: quay.io
        repository: prometheus/alertmanager
        tag: v0.34.0
        sha: 690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d

      externalUrl: https://alertmanager.int.bakseter.net
      secrets:
        - alertmanager-pushover

    revisionHistoryLimit: 5

    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: pushover
        group_by: ['alertname', 'namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers:
              - alertname=~"Watchdog|InfoInhibitor|NodeSystemSaturation"
            receiver: 'null'
      receivers:
        - name: 'null'
        - name: pushover
          pushover_configs:
            - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
              token_file: /etc/alertmanager/secrets/alertmanager-pushover/token

              # --- Visual distinction ---
              title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} {{ .CommonAnnotations.summary }}'
              message: |
                {{ if eq .Status "firing" }}
                🚨 {{ .Alerts.Firing | len }} alert(s) firing
                {{ range .Alerts.Firing }}• {{ .Labels.alertname }}{{ if .Labels.namespace }} ({{ .Labels.namespace }}){{ end }}
                {{ .Annotations.description }}
                {{ end }}
                {{ else }}
                ✅ {{ .Alerts.Resolved | len }} alert(s) resolved
                {{ range .Alerts.Resolved }}• {{ .Labels.alertname }}{{ if .Labels.namespace }} ({{ .Labels.namespace }}){{ end }}
                {{ end }}
                {{ end }}

              # --- Priority: high for firing, low for resolved ---
              # -2=silent, -1=quiet, 0=normal, 1=high, 2=emergency
              priority: '{{ if eq .Status "firing" }}1{{ else }}-1{{ end }}'

              send_resolved: true
              retry: 30m # for priority=2 (emergency) only; harmless otherwise
              expire: 1h # for priority=2 (emergency) only

  grafana:
    enabled: false
    forceDeployDashboards: true

  kubeEtcd:
    enabled: true

    # https://github.com/siderolabs/talos/discussions/7214#discussioncomment-10345376

    service:
      selector:
        k8s-app: kube-controller-manager # Fix selector for kube-etcd for Talos (set itentionally to kube-controller-manager because all master nodes has the same roles)

    serviceMonitor:
      relabelings: # Add nodename label
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: nodename
          replacement: $1
          action: replace
      metricRelabelings: # Remove pod label
        - action: labeldrop
          regex: pod

  kube-state-metrics:
    revisionHistoryLimit: 5

    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

  prometheusOperator:
    revisionHistoryLimit: 5

    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-operator
      tag: v0.93.1@sha256:e52bb28fd41c98dd407c7a8cba8bdcfe7eabd7447e250afaf1fe7bb816dedbff

    prometheusConfigReloader:
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-config-reloader
        tag: v0.93.1@sha256:428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65

  nodeExporter:
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false

  prometheus-node-exporter:
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.12.1-distroless
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106

    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_node_name]
            targetLabel: instance

  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
