kagent:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  providers:
    default: openAI
    openAI:
      modeL: mistral-medium-3-5

  controller:
    agentImage:
      registry: ghcr.io
      repository: bakseter/homelab/ghcr.io/kagent-dev/kagent/app
      tag: 0.9.12@sha256:71e56d9993fe845329cb41e1937d823b243464b09b813a2cb06965b6209be146

  ui:
    httpRoute:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-int
          namespace: tailscale

      hostnames:
        - kagent.int.bakseter.net

  argo-rollouts-agent:
    enabled: false
  cilium-debug-agent:
    enabled: false
  cilium-manager-agent:
    enabled: false
  cilium-policy-agent:
    enabled: false
  helm-agent:
    enabled: false
  istio-agent:
    enabled: false
  k8s-agent:
    enabled: false
  kgateway-agent:
    enabled: false
  observability-agent:
    enabled: false
  promql-agent:
    enabled: false
  grafana-mcp:
    enabled: false
  querydoc:
    enabled: false
