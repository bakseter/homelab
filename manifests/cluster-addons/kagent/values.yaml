kagent:
  config:
    server:
      grpcReflection: true

    database:
      owner:
        role: kagent
      readWrite:
        role: kagent
      vectorEnabled: true
      skipMigrations: false

    telemetry:
      traces:
        endpoint: http://alloy.monitoring.svc.cluster.local:4317
        protocol: grpc
      logs:
        endpoint: http://alloy.monitoring.svc.cluster.local:4317
        protocol: grpc

    runtimeDefaults:
      telemetry:
        traces:
          endpoint: http://alloy.monitoring.svc.cluster.local:4317
          protocol: grpc
        logs:
          endpoint: http://alloy.monitoring.svc.cluster.local:4317
          protocol: grpc

  controller:
    replicas: 2

    substrateClientCertificate:
      enabled: true

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack

    volumes:
      - name: postgres-ca
        secret:
          secretName: kagent-database-ca
          items:
            - key: ca.crt
              path: ca.crt

    volumeMounts:
      - name: postgres-ca
        mountPath: /run/postgres-ca
        readOnly: true

  substrateWorkerPool:
    create: true
    workerImage: 'ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1'
    template:
      nodeSelector:
        node-role.bakseter.net/agent: 'true'
      tolerations:
        - key: node-role.bakseter.net/agent
          operator: Equal
          value: 'true'
          effect: NoSchedule

  database:
    postgres:
      ownerConnectionStringSecretRef:
        name: kagent-database-app
        key: uri

      readWriteConnectionStringSecretRef:
        name: kagent-database-app
        key: uri

  ui:
    externalUrl: https://kagent.bakseter.net
    httpRoute:
      enabled: true

      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-home
          namespace: tailscale

      hostnames:
        - kagent.bakseter.net

      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /

  kagent-tools:
    rbac:
      create: false

    tools:
      prometheus:
        url: http://prometheus-operated.monitoring.svc.cluster.local:9090
