kagent:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  providers:
    default: openAI
    openAI:
      model: mistral-medium-3-5

  controller:
    agentImage:
      registry: ghcr.io

  ui:
    httpRoute:
      enabled: true

      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-home
          namespace: tailscale

      hostnames:
        - kagent.bakseter.net

      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /

  argo-rollouts-agent:
    enabled: false
  cilium-debug-agent:
    enabled: false
  cilium-manager-agent:
    enabled: false
  cilium-policy-agent:
    enabled: false
  helm-agent:
    enabled: false
  istio-agent:
    enabled: false
  k8s-agent:
    enabled: false
  kgateway-agent:
    enabled: false
  observability-agent:
    enabled: false
  promql-agent:
    enabled: false
  grafana-mcp:
    enabled: false
  querydoc:
    enabled: false
