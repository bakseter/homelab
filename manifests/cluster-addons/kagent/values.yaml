kagent:
  controller:
    substrateClientCertificate:
      enabled: true

  substrateWorkerPool:
    create: true
    workerImage: 'ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1'

  ui:
    externalUrl: kagent.bakseter.net
    httpRoute:
      enabled: true

      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-home
          namespace: tailscale

      hostnames:
        - kagent.bakseter.net
