kagent:
  config:
    server:
      grpcReflection: true

    database:
      owner:
        role: kagent
      readWrite:
        role: kagent
      vectorEnabled: true
      skipMigrations: false

  controller:
    replicas: 3

    substrateClientCertificate:
      enabled: true

    volumes:
      - name: postgres-ca
        secret:
          secretName: kagent-database-ca
          items:
            - key: ca.crt
              path: ca.crt

    volumeMounts:
      - name: postgres-ca
        mountPath: /run/postgres-ca
        readOnly: true

  substrateWorkerPool:
    create: true
    workerImage: 'ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1'

  database:
    postgres:
      ownerConnectionStringSecretRef:
        name: kagent-database-app
        key: uri

      readWriteConnectionStringSecretRef:
        name: kagent-database-app
        key: uri

  ui:
    externalUrl: https://kagent.bakseter.net
    httpRoute:
      enabled: true

      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: tailscale-home
          namespace: tailscale

      hostnames:
        - kagent.bakseter.net
