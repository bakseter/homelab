apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: git-mcp
  namespace: kagent
spec:
  transportType: stdio
  deployment:
    image: ghcr.io/bakseter/homelab/git-mcp:2.15.1@sha256:a44ad3559b031d01a7bf47d9124d249ec9d1296b96ef0d5e0ab1bc2d859dcfbb
    cmd: git-mcp-server
    args: []
    env:
      GIT_AUTHOR_NAME: labster
      GIT_AUTHOR_EMAIL: labster@kagent.local
    volumes:
      - name: workspace
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: tmp
        mountPath: /tmp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-mcp
  namespace: kagent
automountServiceAccountToken: false
