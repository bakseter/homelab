apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: git-mcp
  namespace: kagent
spec:
  transportType: stdio
  deployment:
    image: node:22-trixie
    cmd: npx
    args: ['-y', '@cyanheads/git-mcp-server']
    env:
      GIT_AUTHOR_NAME: labster
      GIT_AUTHOR_EMAIL: labster@kagent.local
      GIT_COMMITTER_NAME: labster
      GIT_COMMITTER_EMAIL: labster@kagent.local
    secretRefs:
      - name: forgejo-creds
    volumes:
      - name: workspace
        emptyDir: {}
    volumeMounts:
      - name: workspace
        mountPath: /workspace
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-mcp
  namespace: kagent
automountServiceAccountToken: false
