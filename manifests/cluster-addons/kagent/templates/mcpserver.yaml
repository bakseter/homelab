apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oda-mcp-auth
  namespace: kagent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oda-mcp-bootstrap
  namespace: kagent
spec:
  encryptedData:
    b6f74be1535849863fdebfed8d8bf223_client_info.json: 
    b6f74be1535849863fdebfed8d8bf223_tokens.json: 
  template:
    metadata:
      name: oda-mcp-bootstrap
      namespace: kagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oda-mcp-bootstrap-script
  namespace: kagent
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    D="$HOME/.mcp-auth/mcp-remote-v1"
    mkdir -p "$D"
    for f in /bootstrap/*; do
      [ -e "$f" ] || continue
      b=$(basename "$f")
      if [ ! -e "$D/$b" ]; then
        cp "$f" "$D/$b"
        chmod 600 "$D/$b"
      fi
    done
    exec npx -y mcp-remote@0.13.5 https://oda.com/mcp
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: oda-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  timeout: 60s
  deployment:
    image: node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
    port: 3000
    replicas: 1
    cmd: /bin/sh
    args:
      - /scripts/bootstrap.sh
    env:
      HOME: /data
      NPM_CONFIG_CACHE: /data/.npm
    volumeMounts:
      - name: auth
        mountPath: /data
      - name: bootstrap
        mountPath: /bootstrap
        readOnly: true
      - name: scripts
        mountPath: /scripts
        readOnly: true
    volumes:
      - name: auth
        persistentVolumeClaim:
          claimName: oda-mcp-auth
      - name: bootstrap
        secret:
          secretName: oda-mcp-bootstrap
          defaultMode: 0400
      - name: scripts
        configMap:
          name: oda-mcp-bootstrap-script
          defaultMode: 0555
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: 
          - ALL
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
