apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kagent
  namespace: kagent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent-ui
  timeout:
    http:
      requestTimeout: 3600s
      streamIdleTimeout: 3600s
      maxStreamDuration: 3600s
