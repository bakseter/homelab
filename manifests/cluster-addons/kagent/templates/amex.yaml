apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: amex-mcp
  namespace: kagent
spec:
  description: Amex statement data
  protocol: STREAMABLE_HTTP
  url: http://amex-backend.amex.svc.cluster.local:8000/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: amex-agent
  namespace: kagent
spec:
  description: Answers questions about credit card spending and who owes what.
  type: Declarative
  declarative:
    modelConfig: zai-glm-5-2
    stream: false

    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: amex-mcp
          toolNames:
            - list_invoices
            - get_invoice_summary
            - search_transactions
            - list_categories
            - list_uncategorized
            - review_splits
            - preview_category_rules
            - apply_category_rules
            - delete_category_rules
            - create_categories
            - set_splits
            - update_transactions
          requireApproval:
            - apply_category_rules
            - delete_category_rules
            - create_categories
            - set_splits
            - update_transactions

    systemMessageFrom:
      type: Secret
      name: amex-agent-prompt
      key: system-message

    deployment:
      replicas: 1
      imageRegistry: ghcr.io

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1Gi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

      volumes:
        - name: tmp
          emptyDir: {}

      volumeMounts:
        - name: tmp
          mountPath: /tmp

      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: amex-agent-prompt
  namespace: kagent
spec:
  encryptedData:
    system-message: 
  template:
    metadata:
      name: amex-agent-prompt
      namespace: kagent
