apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oda-shopper-prompt
  namespace: kagent
spec:
  encryptedData:
    system-message: 
  template:
    metadata:
      name: oda-shopper-prompt
      namespace: kagent
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: oda-shopper
  namespace: kagent
spec:
  type: Declarative

  declarative:
    modelConfig: zai-glm-5-2

    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: oda-mcp
          toolNames:
            - clear_cart
            - create_product_list
            - delete_product_list
            - get_brand
            - get_cart
            - get_category
            - get_delivery_slots
            - get_dinner_lists
            - get_liked_recipes
            - get_order
            - get_orders
            - get_product_list
            - get_product_lists
            - get_purchased_recipes
            - likely_to_buy
            - manipulate_cart
            - manipulate_product_list
            - order_tracking
            - product_search
            - recipe_search
            - select_delivery_slot
            - similar_and_related_products
            - unique_for_you
          requireApproval:
            - clear_cart
            - manipulate_cart
            - select_delivery_slot
            - manipulate_product_list
            - create_product_list
            - delete_product_list

    systemMessageFrom:
      type: Secret
      name: oda-shopper-prompt
      key: system-message

    deployment:
      replicas: 1
      imageRegistry: ghcr.io

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

      volumes:
        - name: tmp
          emptyDir: {}

      volumeMounts:
        - name: tmp
          mountPath: /tmp

      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
