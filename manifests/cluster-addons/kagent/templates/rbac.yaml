apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-tools-pod-logs
rules:
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-tools-pod-logs
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-tools-cr-reader
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications', 'applicationsets', 'appprojects']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['cilium.io']
    resources:
      [
        'ciliumnetworkpolicies',
        'ciliumclusterwidenetworkpolicies',
        'ciliumendpoints',
        'ciliumidentities',
        'ciliumnodes',
        'ciliumlocalredirectpolicies',
        'ciliumnodeconfigs',
      ]
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['longhorn.io']
    resources:
      ['volumes', 'nodes', 'engines', 'replicas', 'snapshots', 'backingimages']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['postgresql.cnpg.io']
    resources: ['clusters', 'backups', 'scheduledbackups', 'clusterrestores']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['kagent.dev']
    resources: ['agents', 'agenttemplates', 'mcp', 'modelconfigs', 'harnesses']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-cr-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-tools-cr-reader
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
