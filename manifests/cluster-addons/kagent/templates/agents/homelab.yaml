apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab-agent
  namespace: kagent
spec:
  description: For discussion of homelab architecture and hardware decisions.
  type: Declarative
  declarative:
    modelConfig: mistral-large-4
    stream: true
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: git-mcp
          toolNames:
            - git_clone
            - git_set_working_dir
            - git_status
            - git_diff
            - git_log
            - git_branch
            - git_checkout
            - git_pull

      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: fs-mcp
          toolNames:
            - read_text_file
            - read_multiple_files
            - list_directory
            - directory_tree
            - search_files
            - list_allowed_directories

      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          name: fetch-mcp
          kind: MCPServer
          toolNames:
            - fetch

      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          name: opentofu-mcp
          kind: RemoteMCPServer

      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            # Kubernetes — read-only
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
            # Cilium — visibility only, no mutations
            - cilium_validate_cilium_network_policies
            - cilium_get_endpoints_list
            - cilium_get_endpoint_details
            - cilium_list_identities
            - cilium_get_identity_details
            - cilium_list_envoy_config
            - cilium_show_ip_cache_information
            - cilium_show_dns_names
            - cilium_show_features_status
            - cilium_status_and_version
            # Prometheus — queries only
            - prometheus_query_tool
            - prometheus_query_range_tool
            - prometheus_targets_tool
            - prometheus_label_names_tool
            # Utility
            - datetime_get_current_time

    systemMessageFrom:
      type: Secret
      name: homelab-agent-prompt
      key: system-message

    deployment:
      replicas: 1
      imageRegistry: ghcr.io
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.bakseter.net/agent
          operator: Equal
          value: 'true'
          effect: NoSchedule
      nodeSelector:
        node-role.bakseter.net/agent: 'true'
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homelab-agent
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kagent
      app.kubernetes.io/name: homelab-agent

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: '8083'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent-tools
      toPorts:
        - ports:
            - port: '8084'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: git-mcp
        - matchLabels:
            app.kubernetes.io/name: fs-mcp
        - matchLabels:
            app.kubernetes.io/name: fetch-mcp
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: '4317'
              protocol: TCP

    - toFQDNs:
        - matchName: 'api.mistral.ai'
        - matchName: 'mcp.opentofu.org'
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: homelab-agent-prompt
  namespace: kagent
spec:
  encryptedData:
    system-message: 
  template:
    metadata:
      name: homelab-agent-prompt
      namespace: kagent
