apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp
  namespace: kagent
spec:
  description: Read-only access to the homelab git repo.
  protocol: STREAMABLE_HTTP
  url: https://api.githubcopilot.com/mcp/
  timeout: 30s
  terminateOnClose: false
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: github-mcp-pat
        key: token
    - name: X-MCP-Readonly
      value: 'true'
    - name: X-MCP-Toolsets
      value: 'repos'
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-mcp-pat
  namespace: kagent
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: github-mcp-pat
      namespace: kagent
