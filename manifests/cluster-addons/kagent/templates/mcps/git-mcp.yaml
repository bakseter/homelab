apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: git-mcp
  namespace: kagent
spec:
  transportType: stdio
  deployment:
    replicas: 1
    image: ghcr.io/bakseter/homelab/mcp-tools:1@sha256:c8389d6e163378a2d704ca6853f4854927437250c1a917025de7112a185cb75d
    cmd: git-mcp-server
    env:
      HOME: /home/node
      GIT_AUTHOR_NAME: git-mcp
      GIT_AUTHOR_EMAIL: git-mcp@kagent.internal
      GIT_COMMITTER_NAME: git-mcp
      GIT_COMMITTER_EMAIL: git-mcp@kagent.internal
      GIT_SIGN_COMMITS: 'false'
    volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: git-mcp-fs-mcp-workspace
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: home
        emptyDir:
          sizeLimit: 128Mi
    #     - name: git-creds
    #       secret:
    #         secretName: forgejo-creds
    #         defaultMode: 0400
    #         items:
    #           - key: credentials
    #             path: git-credentials
    volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: tmp
        mountPath: /tmp
      - name: home
        mountPath: /home/node
    #     - name: git-creds
    #       mountPath: /etc/git-credentials
    #       subPath: git-credentials
    #       readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
#   tolerations:
#     - key: node-role.bakseter.net/agent
#       operator: Equal
#       value: 'true'
#       effect: NoSchedule
#   nodeSelector:
#     node-role.bakseter.net/agent: 'true'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-mcp-fs-mcp-workspace
  namespace: kagent
spec:
  accessModes: ['ReadWriteMany'] # also used by fs-mcp
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: git-mcp
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: git-mcp

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
        - matchLabels:
            app.kubernetes.io/managed-by: kagent
            app.kubernetes.io/name: homelab-agent
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP
