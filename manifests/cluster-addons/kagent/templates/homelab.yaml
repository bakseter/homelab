apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-mcp-pat
  namespace: kagent
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: github-mcp-pat
      namespace: kagent
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: homelab-agent-prompt
  namespace: kagent
spec:
  encryptedData:
    system-message: 
  template:
    metadata:
      name: homelab-agent-prompt
      namespace: kagent
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github
  namespace: kagent
spec:
  description: Read-only access to the homelab git repo.
  protocol: STREAMABLE_HTTP
  url: https://api.githubcopilot.com/mcp/
  timeout: 30s
  terminateOnClose: false
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: github-mcp-pat
        key: token
    - name: X-MCP-Readonly
      value: 'true'
    - name: X-MCP-Toolsets
      value: 'repos'
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab
  namespace: kagent
spec:
  description: For discussion of homelab architecture and hardware decisions.
  type: Declarative
  declarative:
    modelConfig: zai-glm-5-3
    stream: false

#   memory:
#     enabled: true
#     modelConfig: embedding-model-config

    tools:
      - type: McpServer
        mcpServer:
          name: github
          kind: RemoteMCPServer
          toolNames:
            - get_file_contents
            - search_code
            - list_commits
            - search_repositories

#     - type: McpServer
#       mcpServer:
#         name: fetch
#         kind: MCPServer

    systemMessageFrom:
      type: Secret
      name: homelab-agent-prompt
      key: system-message

    deployment:
      replicas: 1
      imageRegistry: ghcr.io

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1Gi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

      volumes:
        - name: tmp
          emptyDir: {}

      volumeMounts:
        - name: tmp
          mountPath: /tmp

      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
