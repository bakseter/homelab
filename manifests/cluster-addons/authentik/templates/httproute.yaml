apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server
  namespace: authentik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflared
      namespace: cloudflared

  hostnames:
    - authentik.bakseter.no

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /if/admin/
      filters:
        - type: DirectResponse
          directResponse:
            statusCode: 403
            body:
              type: Inline
              inline:
                value: 'Forbidden'

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ''
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server-tailscale
  namespace: authentik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tailscale-int
      namespace: tailscale

  hostnames:
    - authentik.int.bakseter.net

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ''
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
