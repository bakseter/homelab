        {
          "id": 12, "type": "table", "title": "All pairs (cell color = speed)",
          "gridPos": { "h": 12, "w": 10, "x": 14, "y": 24 },
          "fieldConfig": {
            "defaults": {
              "unit": "bps", "decimals": 2,
              "custom": { "align": "auto", "cellHeight": "sm", "displayMode": "color-background" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "orange", "value": 900000000 }, { "color": "green", "value": 1800000000 }
              ] }
            },
            "overrides": []
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Value", "desc": true }] },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "expr": "sum by (mode, node, dst) (iperf3_bandwidth_bps)",
            "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "mode": "Mode", "node": "Src node", "dst": "Dst IP", "Value": "Bandwidth" } } }
          ]
        },
