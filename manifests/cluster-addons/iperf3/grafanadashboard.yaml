          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 600 }] } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "expr": "max by (mode, node, dst) (iperf3_result_age_seconds)",
            "legendFormat": "{{mode}}: {{node}} → {{dst}}", "refId": "A" }]
        },
