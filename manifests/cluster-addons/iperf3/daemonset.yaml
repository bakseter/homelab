apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iperf3-node
  namespace: iperf3
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf3
      app.kubernetes.io/component: iperf3-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iperf3
        app.kubernetes.io/component: iperf3-node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: iperf3
          image: networkstatic/iperf3:latest@sha256:d8767f2888155902ec72760f9ba8dd6fb16ff73256a8e02572c109aecc23269b
          command: ['/bin/sh', '/opt/iperf3/run.sh']
          env:
            - name: MY_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MODE
              value: node
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: results
              mountPath: /results
            - name: run
              mountPath: /opt/iperf3
          ports:
            - name: iperf
              containerPort: 5201
              hostPort: 5201
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: exporter
          image: python:3.14-alpine@sha256:a18b20ad69e74df6cf6d2e1b1a260d7a1ecf5380fd83b310f83ba88c461cf894
          command: ['python3', '/app/exporter.py']
          env:
            - name: MY_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MODE
              value: node
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: results
              mountPath: /results
              readOnly: true
            - name: exporter
              mountPath: /app
          ports:
            - name: metrics
              containerPort: 8080
              hostPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: results
          emptyDir: {}
        - name: run
          configMap:
            name: iperf3-run
        - name: exporter
          configMap:
            name: iperf3-exporter
      tolerations:
        - effect: NoSchedule
          key: node-role.bakseter.net/agent
          operator: Equal
          value: 'true'
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iperf3-pod
  namespace: iperf3
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf3
      app.kubernetes.io/component: iperf3-pod
