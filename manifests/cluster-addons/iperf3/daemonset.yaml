              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: results
          emptyDir: {}
        - name: run
          configMap:
            name: iperf3-run
        - name: exporter
          configMap:
            name: iperf3-exporter
      tolerations:
        - effect: NoSchedule
          key: node-role.bakseter.net/agent
          operator: Equal
          value: 'true'
