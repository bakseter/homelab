apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: iperf3-pod
  namespace: iperf3
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: iperf3
      app.kubernetes.io/component: iperf3-pod

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: iperf3
            app.kubernetes.io/component: iperf3-pod
      toPorts:
        - ports:
            - port: '5201'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '5201'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: 'iperf3-pod-headless.iperf3.svc.cluster.local'

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: iperf3
            app.kubernetes.io/component: iperf3-pod
      toPorts:
        - ports:
            - port: '5201'
              protocol: TCP
