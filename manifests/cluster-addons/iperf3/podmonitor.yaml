apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iperf3
  namespace: iperf3
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf3
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_pod_host
