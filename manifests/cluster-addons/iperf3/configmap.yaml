apiVersion: v1
kind: ConfigMap
metadata:
  name: iperf3-exporter
  namespace: iperf3
data:
  exporter.py: |
    import glob, json, os, sys, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    RESULTS, MY_IP, MODE, NODE = "/results", os.environ["MY_IP"], os.environ["MODE"], os.environ["NODE"]
    L = f'src="{MY_IP}",node="{NODE}",mode="{MODE}"'

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            lines = ["# HELP iperf3_bandwidth_bps TCP throughput src->dst, bits per second.",
                     "# TYPE iperf3_bandwidth_bps gauge",
                     "# HELP iperf3_result_age_seconds Seconds since last successful test for this peer.",
                     "# TYPE iperf3_result_age_seconds gauge"]

            now = time.time()

            for f in sorted(glob.glob(RESULTS + "/result-*.json")):
                dst = os.path.basename(f)[7:-5]
                try:
                    d = json.load(open(f))
                    bps = d["end"]["sum_received"]["bits_per_second"]
                    lines.append(f'iperf3_bandwidth_bps{{{L},dst="{dst}"}} {bps}')
                    lines.append(f'iperf3_result_age_seconds{{{L},dst="{dst}"}} {now - os.path.getmtime(f):.0f}')
                except Exception as e:
                    print(f"parse error {f}: {e}", file=sys.stderr, flush=True)

            body = ("\n".join(lines) + "\n").encode()

            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a): pass

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iperf3-run
  namespace: iperf3
data:
  run.sh: |
    #!/bin/sh

    iperf3 -s -p 5201 &
    SERVER_PID=$!
    sleep 2
    if ! kill -0 "$SERVER_PID" 2>/dev/null; then
      echo "iperf3 server exited at startup" >&2
      exit 1
    fi

    sleep $(( $(hostname | cksum | cut -d' ' -f1) % 45 ))

    while true; do
      for PEER in $(getent hosts "iperf3-${MODE}-headless.iperf3.svc.cluster.local" | awk '{print $1}' | grep -vFx "$MY_IP"); do
        for attempt in 1 2; do
          if iperf3 -c "$PEER" -p 5201 -t 10 -J > "/results/.tmp-${PEER}" 2>>/results/errors.log; then
            mv "/results/.tmp-${PEER}" "/results/result-${PEER}.json"
            break
          fi

          [ "$attempt" -eq 1 ] && sleep 5   # server busy -> retry once
        done

        sleep $(( 2 + $(hostname | cksum | cut -d' ' -f1) % 5 ))
      done

      sleep 300
    done
