apiVersion: v1
kind: ConfigMap
metadata:
  name: iperf3-exporter
  namespace: iperf3
data:
  exporter.py: |
    import glob, json, os, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    RESULTS, MY_IP = "/results", os.environ["MY_IP"]

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            lines = ["# HELP iperf3_bandwidth_bps TCP throughput src->dst, bits per second.",
                     "# TYPE iperf3_bandwidth_bps gauge",
                     "# HELP iperf3_result_age_seconds Seconds since last successful test for this peer.",
                     "# TYPE iperf3_result_age_seconds gauge"]

            now = time.time()
            for f in sorted(glob.glob(RESULTS + "/result-*.json")):
                dst = os.path.basename(f)[7:-5]   # strip "result-" and ".json"
                try:
                    bps = json.load(open(f))["end"]["sum_received"]["bits_per_second"]
                    lines.append(f'iperf3_bandwidth_bps{{src="{MY_IP}",dst="{dst}"}} {bps}')
                    lines.append(f'iperf3_result_age_seconds{{src="{MY_IP}",dst="{dst}"}} {now - os.path.getmtime(f):.0f}')
                except Exception:
                    pass  # error JSON (no "end") or mid-write; next scrape picks it up

            body = ("\n".join(lines) + "\n").encode()

            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a): pass

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
