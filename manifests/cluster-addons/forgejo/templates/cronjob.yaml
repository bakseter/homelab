apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-copier
  namespace: forgejo
  labels:
    app.kubernetes.io/name: homelab-copier
spec:
  schedule: '*/15 * * * *' # every 30 minutes
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: homelab-copier
        spec:
          restartPolicy: Never
          containers:
            - image: ghcr.io/bakseter/homelab/alpine/git-cacerts:3.24@sha256:acc40dd77cd536fd8f945d9230b747f2e97acd15a5a2eac504289eb2f1f4ed42
              name: homelab-copier
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -e
                  git config --global core.sshCommand 'ssh -i /var/run/secrets/homelab-copier/ssh-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

                  for repo in amex bakseter.no five31 homelab; do
                    rm -rf "/tmp/$repo"
                    git clone "https://github.com/bakseter/$repo" "/tmp/$repo"
                    cd "/tmp/$repo"

                    git remote add forgejo "git@forgejo-ssh.forgejo.svc.cluster.local:bakseter/$repo"
                    git push forgejo +refs/heads/master:refs/heads/master
                  done
              env:
                - name: HOME
                  value: /tmp
              resources:
                limits:
                  memory: 64Mi
                requests:
                  memory: 16Mi
                  cpu: 50m
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: ssh-key
                  mountPath: /var/run/secrets/homelab-copier
                  readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
            - name: ssh-key
              secret:
                secretName: forgejo-homelab-copier-ssh-key
                items:
                  - key: homelab-copier
                    path: ssh-key
                    mode: 0400
