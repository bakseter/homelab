apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-copier
  namespace: forgejo
  labels:
    app.kubernetes.io/name: homelab-copier
spec:
  schedule: 0 3 * * *
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: homelab-copier
        spec:
          restartPolicy: Never
          containers:
            - image: ghcr.io/bakseter/homelab/alpine/git-cacerts:3.24@sha256:8c829ebb8735a714c66658ca606868201f0e00088a70e15382c48581f92d04d9
              name: homelab-copier
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -e
                  git config --global core.sshCommand 'ssh -i /var/run/secrets/homelab-copier/ssh-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
                  git clone https://github.com/bakseter/homelab /tmp/homelab
                  cd /tmp/homelab
                  git remote add forgejo git@forgejo-ssh.forgejo.svc.cluster.local:bakseter/homelab
                  git push forgejo master
              env:
                - name: HOME
                  value: /tmp
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 16Mi
                  cpu: 50m
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: ssh-key
                  mountPath: /var/run/secrets/homelab-copier
                  readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
            - name: ssh-key
              secret:
                secretName: forgejo-homelab-copier-ssh-key
                items:
                  - key: homelab-copier
                    path: ssh-key
                    mode: 0400
