apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tuppr
  
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: '9443'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
            - port: '50000'
              protocol: TCP

    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '50000'
              protocol: TCP

    - toFQDNs:
        - matchName: 'factory.talos.dev'
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-upgrade
  namespace: system-upgrade
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talos-upgrade
      app.kubernetes.io/part-of: tuppr

  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
            - port: '50000'
              protocol: TCP

    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '50000'
              protocol: TCP

    - toCIDR:
        - 192.168.30.190/32 # VIP
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-upgrade
