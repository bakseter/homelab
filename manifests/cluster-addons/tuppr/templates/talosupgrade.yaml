apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.6

  policy:
    drainTimeout: 10m0s
    timeout: 20m0s
    waitForVolumeDetach: true

  healthChecks:
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      expr: status.robustness in ['healthy', 'unknown']

  maintenance:
    windows:
      - duration: 2h0m0s
        start: '0 1 * * 1-6'
        timezone: UTC
