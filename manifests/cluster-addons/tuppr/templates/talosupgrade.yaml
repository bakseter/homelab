apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: longhorn-nodes
spec:
  nodeSelector:
    matchExpressions:
      - key: node.longhorn.io/create-default-disk
        operator: Exists

  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.7

  policy:
    drainTimeout: 10m0s
    timeout: 20m0s
    waitForVolumeDetach: true
    force: true

  healthChecks:
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      expr: status.robustness in ['healthy', 'unknown']
---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: non-longhorn-nodes
spec:
  nodeSelector:
    matchExpressions:
      - key: node.longhorn.io/create-default-disk
        operator: DoesNotExist

  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.7
