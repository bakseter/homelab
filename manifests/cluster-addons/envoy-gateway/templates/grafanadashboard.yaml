apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  title: envoy-gateway
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-clusters
  namespace: envoy-gateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: envoy-gateway
  url: https://raw.githubusercontent.com/envoyproxy/gateway/3ec9a015695c0b5ed8ad29fe65ff7a13449a8527/charts/gateway-addons-helm/dashboards/envoy-clusters.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-gateway-global
  namespace: envoy-gateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: envoy-gateway
  url: https://raw.githubusercontent.com/envoyproxy/gateway/3ec9a015695c0b5ed8ad29fe65ff7a13449a8527/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-proxy-global
  namespace: envoy-gateway-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: envoy-gateway
  url: https://raw.githubusercontent.com/envoyproxy/gateway/3ec9a015695c0b5ed8ad29fe65ff7a13449a8527/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
