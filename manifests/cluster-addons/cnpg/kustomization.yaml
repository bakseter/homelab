apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    releaseName: cloudnative-pg
    namespace: cnpg-system
    valuesFile: values-cnpg.yaml
    includeCRDs: true
  - name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: 0.8.0
    releaseName: barman-cloud
    namespace: cnpg-system
    valuesFile: values-barman.yaml
    includeCRDs: true

resources:
  - ciliumnetworkpolicy.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/artifacts/refs/heads/main/image-catalogs-extensions/catalog-minimal-trixie.yaml
