apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: Exists
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - cert-manager # TODO: make netpol and remove

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cilium-l2-announcement-gossip
spec:
  nodeSelector:
    matchLabels: {}

  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: '37278'
              protocol: ANY

  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: '37278'
              protocol: ANY
