apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/name: argocd-repo-server

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argocd
            app.kubernetes.io/name: argocd-application-controller
        - matchLabels:
            app.kubernetes.io/instance: argocd
            app.kubernetes.io/name: argocd-applicationset-controller
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP

    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '8084'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toFQDNs:
        - matchName: argoproj.github.io
        - matchName: auth.docker.io
        - matchName: bitnami.github.io
        - matchName: charts.goauthentik.io
        - matchName: charts.jetstack.io
        - matchName: charts.longhorn.io
        - matchName: charts.rustfs.com
        - matchName: cloudnative-pg.github.io
        - matchName: democratic-csi.github.io
        - matchName: github.com
        - matchName: ghcr.io
        - matchName: intel.github.io
        - matchName: kubernetes-sigs.github.io
        - matchName: pkgs.tailscale.com
        - matchName: pkg-containers.githubusercontent.com
        - matchName: production.cloudfront.docker.com
        - matchName: raw.githubusercontent.com
        - matchName: registry-1.docker.io
        - matchName: release-assets.githubusercontent.com
        - matchName: vmware-tanzu.github.io
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: '22'
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argocd
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: '6379'
              protocol: TCP
---
