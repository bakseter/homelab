name: Build images

on:
  push:
    branches: [master]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE_NAME_PREFIX: 'ghcr.io/${{ github.repository }}'
    strategy:
      fail-fast: false
      matrix:
        image:
          - data.forgejo.org/forgejo/runner:13

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Get Dockerfile path and image name
        id: get-env
        run: |
          echo "dockerfile=$(echo $MATRIX_IMAGE | sed -e 's/\//+/g')" >> "$GITHUB_OUTPUT"
          echo "image-name-with-tag=$IMAGE_NAME_PREFIX/$MATRIX_IMAGE" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_IMAGE: ${{ matrix.image }}

      - name: Build image with cache and push to registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: 'images/Dockerfile.${{ steps.get-env.outputs.dockerfile }}'
          context: 'images'
          push: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
          tags: ${{ steps.get-env.outputs.image-name-with-tag }}
